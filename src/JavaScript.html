<script>
  var awaitingNextGame = false;
  var lastAcknowledgedGameCount = 0;
  var lastState = null;
  var matchTimerHandle = null;

  function formatDuration(ms) {
    var totalSec = Math.floor(ms / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return (h > 0 ? h + ':' + pad(m) : m) + ':' + pad(s);
  }

  function updateTimerDisplay(startTimeMs) {
    var el = document.getElementById('matchTimer');
    if (!el) return;
    el.textContent = '⏱ ' + formatDuration(Date.now() - startTimeMs);
  }

  function startMatchTimer(startTimeMs) {
    stopMatchTimer();
    updateTimerDisplay(startTimeMs);
    matchTimerHandle = setInterval(function () { updateTimerDisplay(startTimeMs); }, 1000);
  }

  function stopMatchTimer() {
    if (matchTimerHandle) {
      clearInterval(matchTimerHandle);
      matchTimerHandle = null;
    }
  }

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(btn.dataset.tab); });
  });

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.querySelectorAll('.tab-view').forEach(function (v) {
      v.classList.toggle('hidden', v.id !== 'tab-' + tab);
    });
    if (tab === 'history') loadHistory();
  }

  document.getElementById('refreshHistoryBtn').addEventListener('click', loadHistory);

  function loadHistory() {
    var gamesWrap = document.getElementById('historyTableWrap');
    var matchesWrap = document.getElementById('matchesTableWrap');
    gamesWrap.innerHTML = '<div class="history-empty">Loading…</div>';
    matchesWrap.innerHTML = '<div class="history-empty">Loading…</div>';
    google.script.run.withSuccessHandler(renderHistory).withFailureHandler(onError).getMatchHistory();
    google.script.run.withSuccessHandler(renderMatchSummaries).withFailureHandler(onError).getMatchSummaries();
  }

  function renderHistory(rows) {
    var wrap = document.getElementById('historyTableWrap');
    if (!rows || rows.length === 0) {
      wrap.innerHTML = '<div class="history-empty">No completed games logged yet.</div>';
      return;
    }
    var html = '<div class="history-table-wrap"><table class="history-table"><thead><tr>' +
      '<th>Date</th><th>Team A</th><th>Team B</th><th>Game #</th><th>Score</th><th>Winner</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr><td>' + r.date + '</td><td>' + r.team1 + '</td><td>' + r.team2 + '</td><td>' +
        r.gameNumber + '</td><td>' + r.team1Score + '-' + r.team2Score + '</td><td>' + r.winner + '</td></tr>';
    });
    html += '</tbody></table></div>';
    wrap.innerHTML = html;
  }

  function renderMatchSummaries(rows) {
    var wrap = document.getElementById('matchesTableWrap');
    if (!rows || rows.length === 0) {
      wrap.innerHTML = '<div class="history-empty">No completed matches logged yet.</div>';
      return;
    }
    var html = '<div class="history-table-wrap"><table class="history-table"><thead><tr>' +
      '<th>Started</th><th>Ended</th><th>Duration</th><th>Team A</th><th>Team B</th><th>Games</th><th>Winner</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr><td>' + r.started + '</td><td>' + r.ended + '</td><td>' + r.duration + '</td><td>' +
        r.team1 + '</td><td>' + r.team2 + '</td><td>' + r.gamesWon + '</td><td>' + r.winner + '</td></tr>';
    });
    html += '</tbody></table></div>';
    wrap.innerHTML = html;
  }

  document.getElementById('startBtn').addEventListener('click', function () {
    var team1 = {
      name: document.getElementById('t1name').value || 'Team A',
      players: [document.getElementById('t1p1').value, document.getElementById('t1p2').value]
    };
    var team2 = {
      name: document.getElementById('t2name').value || 'Team B',
      players: [document.getElementById('t2p1').value, document.getElementById('t2p2').value]
    };
    var bestOf = document.getElementById('bestOf').value;
    var winScore = document.getElementById('winScore').value;

    this.disabled = true;
    google.script.run
      .withSuccessHandler(function (state) {
        document.getElementById('startBtn').disabled = false;
        resetAcknowledgement();
        render(state);
      })
      .withFailureHandler(onError)
      .startMatch(team1, team2, bestOf, winScore);
  });

  document.getElementById('plus1').addEventListener('click', function () { awardRally('team1'); });
  document.getElementById('plus2').addEventListener('click', function () { awardRally('team2'); });
  document.getElementById('minus1').addEventListener('click', runUndo);
  document.getElementById('minus2').addEventListener('click', runUndo);

  document.getElementById('undoBtn').addEventListener('click', runUndo);

  function runUndo() {
    google.script.run.withSuccessHandler(render).withFailureHandler(onError).undo();
  }

  document.getElementById('newGameBtn').addEventListener('click', function () {
    if (lastState) lastAcknowledgedGameCount = lastState.games.length;
    render(lastState);
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('Reset the whole match? This clears the current scoreboard.')) return;
    google.script.run.withSuccessHandler(render).withFailureHandler(onError).resetMatch();
  });

  document.getElementById('endMatchBtn').addEventListener('click', function () {
    if (!confirm('End the match now? The winner will be whichever side has won more games (ties broken by the current game\'s score, if any points were played).')) return;
    google.script.run.withSuccessHandler(function (state) {
      render(state);
      if (state && !state.matchWinner) {
        alert('Games (and the current game) are tied — cannot auto-determine a winner. Keep playing or use +1/Undo to break the tie first.');
      }
    }).withFailureHandler(onError).endMatch();
  });

  function awardRally(side) {
    if (awaitingNextGame) return; // game finished, waiting for "Start Next Game"
    google.script.run.withSuccessHandler(render).withFailureHandler(onError).awardRally(side);
  }

  function resetAcknowledgement() {
    lastAcknowledgedGameCount = 0;
    awaitingNextGame = false;
  }

  function onError(err) {
    console.error(err);
    alert('Something went wrong: ' + (err && err.message ? err.message : err));
  }

  function render(state) {
    var setup = document.getElementById('setup');
    var board = document.getElementById('board');

    if (!state) {
      resetAcknowledgement();
      stopMatchTimer();
      lastState = null;
      setup.classList.remove('hidden');
      board.classList.add('hidden');
      return;
    }

    lastState = state;
    setup.classList.add('hidden');
    board.classList.remove('hidden');

    document.getElementById('name1').textContent = state.team1.name;
    document.getElementById('name2').textContent = state.team2.name;
    document.getElementById('players1').textContent = state.team1.players.filter(Boolean).join(' / ');
    document.getElementById('players2').textContent = state.team2.players.filter(Boolean).join(' / ');

    var cur = state.current;
    var scoreSuffix = '-' + cur.serverNumber;
    document.getElementById('score1').textContent = cur.team1Score + (cur.servingTeam === 1 ? scoreSuffix : '');
    document.getElementById('score2').textContent = cur.team2Score + (cur.servingTeam === 2 ? scoreSuffix : '');

    document.getElementById('serve1').classList.toggle('active', cur.servingTeam === 1);
    document.getElementById('serve2').classList.toggle('active', cur.servingTeam === 2);

    setServingLabel('servingLabel1', state.team1, cur, 1);
    setServingLabel('servingLabel2', state.team2, cur, 2);

    var gamesToWin = Math.ceil(state.bestOf / 2);
    renderTally('tally1', state.games, 1, gamesToWin);
    renderTally('tally2', state.games, 2, gamesToWin);

    var team1Wins = state.games.filter(function (g) { return g.winner === 1; }).length;
    var team2Wins = state.games.filter(function (g) { return g.winner === 2; }).length;

    var statusBar = document.getElementById('statusBar');
    statusBar.textContent = 'Game ' + (state.games.length + (state.matchWinner ? 0 : 1)) +
      ' of best-of-' + state.bestOf + '  ·  Games won ' + team1Wins + '-' + team2Wins;

    var gameOverBanner = document.getElementById('gameOverBanner');
    var matchOverBanner = document.getElementById('matchOverBanner');
    var newGameBtn = document.getElementById('newGameBtn');

    var lastGame = state.games[state.games.length - 1];
    var gameJustEnded = lastGame && !state.matchWinner &&
      state.games.length > lastAcknowledgedGameCount;

    if (state.matchWinner) {
      awaitingNextGame = false;
      stopMatchTimer();
      var durationMs = state.matchDurationMs != null ? state.matchDurationMs : (Date.now() - state.matchStartTime);
      document.getElementById('matchTimer').textContent = '⏱ ' + formatDuration(durationMs) + ' (final)';
      var winnerName = state.matchWinner === 1 ? state.team1.name : state.team2.name;
      matchOverBanner.textContent = '🏆 ' + winnerName + ' wins the match! (' + formatDuration(durationMs) + ')';
      matchOverBanner.classList.remove('hidden');
      gameOverBanner.classList.add('hidden');
      newGameBtn.classList.add('hidden');
    } else if (gameJustEnded) {
      awaitingNextGame = true;
      var gWinnerName = lastGame.winner === 1 ? state.team1.name : state.team2.name;
      gameOverBanner.textContent = gWinnerName + ' wins game ' + state.games.length +
        ' (' + lastGame.team1Score + '-' + lastGame.team2Score + ')';
      gameOverBanner.classList.remove('hidden');
      matchOverBanner.classList.add('hidden');
      newGameBtn.classList.remove('hidden');
    } else {
      awaitingNextGame = false;
      gameOverBanner.classList.add('hidden');
      matchOverBanner.classList.add('hidden');
      newGameBtn.classList.add('hidden');
    }

    var noHistory = !state.history || state.history.length === 0;
    document.getElementById('undoBtn').disabled = noHistory;
    document.getElementById('minus1').disabled = noHistory;
    document.getElementById('minus2').disabled = noHistory;
    document.getElementById('plus1').disabled = awaitingNextGame || !!state.matchWinner;
    document.getElementById('plus2').disabled = awaitingNextGame || !!state.matchWinner;

    var endMatchBtn = document.getElementById('endMatchBtn');
    endMatchBtn.classList.toggle('hidden', !!state.matchWinner);
    endMatchBtn.disabled = !!state.matchWinner;

    if (!state.matchWinner && state.matchStartTime && !matchTimerHandle) {
      startMatchTimer(state.matchStartTime);
    }

    renderGameHistory(state);
  }

  function renderGameHistory(state) {
    var el = document.getElementById('gameHistory');
    if (!state.games.length) {
      el.innerHTML = '';
      return;
    }
    el.innerHTML = state.games.map(function (g, i) {
      var winnerName = g.winner === 1 ? state.team1.name : state.team2.name;
      return '<div class="entry">Game ' + (i + 1) + ': <b>' + g.team1Score + '-' + g.team2Score +
        '</b> &mdash; ' + winnerName + ' won</div>';
    }).join('');
  }

  function setServingLabel(elId, team, cur, teamNum) {
    var el = document.getElementById(elId);
    if (cur.servingTeam !== teamNum) {
      el.classList.remove('active');
      el.textContent = '';
      return;
    }
    var name = team.players[cur.serverNumber - 1] || ('Server ' + cur.serverNumber);
    el.textContent = 'Serving: ' + name;
    el.classList.add('active');
  }

  function renderTally(elId, games, teamNum, gamesToWin) {
    var el = document.getElementById(elId);
    el.innerHTML = '';
    var won = games.filter(function (g) { return g.winner === teamNum; }).length;
    for (var i = 0; i < gamesToWin; i++) {
      var pip = document.createElement('div');
      pip.className = 'pip' + (i < won ? ' won' : '');
      el.appendChild(pip);
    }
  }

  // Initial load
  google.script.run.withSuccessHandler(render).withFailureHandler(onError).getState();
</script>
