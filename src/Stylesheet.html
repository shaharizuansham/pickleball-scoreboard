<style>
  :root {
    --bg: #0b1220;
    --panel: #121b2e;
    --team1: #22d3ee;
    --team2: #f97316;
    --text: #f5f7fa;
    --muted: #8b97ab;
    --green: #22c55e;
    --red: #ef4444;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .hidden { display: none !important; }

  /* --- Tab bar --- */
  .tabbar {
    display: flex;
    background: var(--panel);
    border-bottom: 1px solid #1c2740;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 12px 8px;
    background: transparent;
    color: var(--muted);
    font-size: 0.85rem;
    border-radius: 0;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--green); }

  .tab-view { min-height: calc(100vh - 46px); }

  .page-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    line-height: 1.55;
  }
  .page-inner h2 { margin-top: 0; }
  .page-inner h3 { margin-top: 28px; color: var(--team1); }
  .page-inner ul { padding-left: 20px; }
  .page-inner li { margin-bottom: 10px; }
  .page-inner a { color: var(--team1); }
  .page-inner code {
    background: #1c2740;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }

  .glossary { border-collapse: collapse; width: 100%; margin-top: 8px; }
  .glossary td { padding: 8px 10px; border-bottom: 1px solid #1c2740; vertical-align: top; }
  .glossary td:first-child { color: var(--team2); white-space: nowrap; }

  .court-diagram { width: 100%; height: auto; margin-top: 12px; }
  .court-label { fill: var(--text); font-size: 11px; font-family: inherit; }
  .court-label.small { fill: var(--muted); font-size: 8px; letter-spacing: 0.5px; }
  .court-label.dim { fill: var(--muted); font-size: 10px; }

  /* --- History tab --- */
  #refreshHistoryBtn {
    padding: 10px 16px;
    background: #1c2740;
    color: var(--text);
    margin-bottom: 12px;
  }
  .history-table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  .history-table th, .history-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #1c2740;
    text-align: left;
    white-space: nowrap;
  }
  .history-table th { color: var(--muted); font-weight: 600; }
  .history-table-wrap { overflow-x: auto; }
  .history-empty { color: var(--muted); padding: 20px 0; text-align: center; }

  /* --- In-match game history list --- */
  .game-history {
    padding: 8px 16px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
  .game-history .entry { margin: 2px 0; }
  .game-history .entry b { color: var(--text); }

  /* --- Setup screen --- */
  #setup {
    max-width: 520px;
    margin: 24px auto;
    padding: 20px;
  }

  #setup h1 { text-align: center; font-size: 1.6rem; margin-bottom: 4px; }
  #setup p.sub { text-align: center; color: var(--muted); margin-top: 0; }

  .team-form {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    border: 2px solid transparent;
  }
  .team-form.team1 { border-color: var(--team1); }
  .team-form.team2 { border-color: var(--team2); }

  .team-form label { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  .team-form input, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #2a3752;
    background: #0e1626;
    color: var(--text);
    font-size: 1rem;
    margin-top: 4px;
  }

  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-family: inherit;
  }

  #startBtn {
    width: 100%;
    padding: 16px;
    font-size: 1.1rem;
    background: var(--green);
    color: #06210f;
    margin-top: 8px;
  }

  .serve-choice { display: flex; gap: 10px; margin-top: 6px; margin-bottom: 16px; }
  .serve-choice-btn {
    flex: 1;
    padding: 12px;
    font-size: 0.95rem;
    background: #1c2740;
    color: var(--muted);
    border: 2px solid transparent;
  }
  .serve-choice-btn.team1.active { background: rgba(34,211,238,0.15); color: var(--team1); border-color: var(--team1); }
  .serve-choice-btn.team2.active { background: rgba(249,115,22,0.15); color: var(--team2); border-color: var(--team2); }

  /* --- Scoreboard screen --- */
  #board {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .status-bar {
    text-align: center;
    padding: 8px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .match-timer {
    text-align: center;
    color: var(--text);
    font-size: 1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding-bottom: 4px;
  }

  .legend {
    text-align: center;
    padding: 0 12px 10px;
    color: var(--muted);
    font-size: 0.78rem;
  }
  .legend b { color: var(--text); }

  .score-row {
    display: flex;
    flex: 1;
    min-height: 55vh;
  }

  .side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
    transition: background 0.15s ease;
  }

  .side.team1 { background: linear-gradient(180deg, #0b1220, #0d2430); }
  .side.team2 { background: linear-gradient(180deg, #0b1220, #2a1608); }

  .side .name { font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 700; text-align: center; }
  .side.team1 .name { color: var(--team1); }
  .side.team2 .name { color: var(--team2); }

  .side .players { color: var(--muted); font-size: 0.9rem; margin-top: 4px; text-align: center; }

  .side .score { font-size: clamp(4rem, 18vw, 9rem); font-weight: 800; line-height: 1; margin: 12px 0; }

  .serve-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    margin-top: 4px;
    visibility: hidden;
  }
  .serve-dot.active { visibility: visible; }

  .serving-label {
    font-size: 0.85rem;
    color: var(--green);
    font-weight: 700;
    margin-top: 4px;
    height: 1.1em;
    visibility: hidden;
  }
  .serving-label.active { visibility: visible; }

  .score-buttons { display: flex; gap: 10px; margin-top: 4px; }
  .score-buttons .score-btn {
    padding: 12px 22px;
    font-size: 1.3rem;
    font-weight: 800;
    border-radius: 10px;
    color: var(--text);
  }
  .score-buttons .score-btn.plus { background: var(--green); color: #06210f; }
  .score-buttons .score-btn.minus { background: #2a3752; }
  .score-buttons .score-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .games-tally { display: flex; gap: 6px; margin-top: 10px; }
  .games-tally .pip {
    width: 10px; height: 10px; border-radius: 50%;
    background: #2a3752;
  }
  .games-tally .pip.won { background: currentColor; }

  .divider { width: 2px; background: #1c2740; }

  .controls {
    display: flex;
    gap: 10px;
    padding: 12px;
    background: var(--panel);
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls button {
    padding: 12px 18px;
    font-size: 0.95rem;
    background: #1c2740;
    color: var(--text);
  }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  .controls button.primary { background: var(--green); color: #06210f; }
  .controls button.danger { background: var(--red); color: #290808; }

  .game-over-banner {
    text-align: center;
    padding: 16px;
    background: #10331d;
    color: var(--green);
    font-weight: 700;
    font-size: 1.1rem;
  }

  .match-over-banner {
    text-align: center;
    padding: 20px;
    background: #10331d;
    color: var(--green);
    font-weight: 800;
    font-size: 1.4rem;
  }
</style>
